<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histoire · Géographie · EMC — Collège</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#F3ECDC; --parchment-deep:#EAE0C8; --ink:#2B241B; --ink-soft:#5A4F3E;
  --bordeaux:#8B2625; --bordeaux-deep:#6E1D2A; --rust:#C1622B; --teal:#2B5D5C; --gold:#A98F4B;
  --paper-line: rgba(43,36,27,0.08); --shadow: 0 8px 24px rgba(43,36,27,0.14); --radius: 14px;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--parchment); color:var(--ink); font-family:'Work Sans',sans-serif; min-height:100vh;}
.display{font-family:'Cormorant Garamond',serif;}
.mono{font-family:'IBM Plex Mono',monospace; letter-spacing:.03em;}
button{border:none; background:none; font-family:inherit; cursor:pointer; text-align:left;}
.topbar{display:flex; align-items:center; gap:12px; padding:18px 32px; border-bottom:1px solid var(--paper-line); background:linear-gradient(180deg, rgba(255,255,255,.5), transparent);}
.brand-seal{width:38px; height:38px; border-radius:50%; background:var(--bordeaux); color:var(--parchment); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px;}
.brand-text .t1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px;}
.brand-text .t2{font-size:11px; color:var(--ink-soft); letter-spacing:.08em; text-transform:uppercase;}
.breadcrumb{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:14px 32px; font-size:13px;}
.crumb{display:flex; align-items:center; gap:6px; color:var(--ink-soft); padding:5px 12px; background:rgba(255,255,255,.55); border:1px solid var(--paper-line); border-radius:999px;}
.crumb.current{color:var(--parchment); background:var(--bordeaux); border-color:var(--bordeaux); font-weight:600;}
.crumb-sep{color:var(--gold); font-size:11px;}
main{padding:8px 32px 80px; max-width:980px; margin:0 auto;}
.view{display:none; animation:fade .3s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--rust); font-weight:600; margin:24px 0 6px;}
h1.page-title{font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:700; margin:0 0 6px;}
p.page-sub{color:var(--ink-soft); margin:0 0 26px; max-width:640px; font-size:15px;}
.niveaux-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:34px;}
.niveau-card{position:relative; background:linear-gradient(160deg,#fff,var(--parchment-deep)); border:1px solid var(--paper-line); border-radius:var(--radius); padding:24px 20px; box-shadow:var(--shadow); overflow:hidden; transition:transform .15s;}
.niveau-card::before{content:""; position:absolute; top:0; left:0; right:0; height:6px; background:var(--card-accent,var(--bordeaux));}
.niveau-card:hover{transform:translateY(-4px);}
.niveau-tag{display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; background:var(--card-accent,var(--bordeaux)); color:#fff; margin-bottom:12px; font-weight:600;}
.niveau-card h2{font-family:'Cormorant Garamond',serif; font-size:28px; margin:0 0 8px;}
.niveau-card p{margin:0 0 14px; color:var(--ink-soft); font-size:13px;}
.niveau-card .go{font-size:13px; font-weight:600; color:var(--card-accent,var(--bordeaux));}
.transversal-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.transversal-card{display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.55); border:1px dashed var(--gold); border-radius:var(--radius); padding:16px 18px;}
.transversal-card h3{margin:0 0 3px; font-family:'Cormorant Garamond',serif; font-size:18px;}
.transversal-card p{margin:0; font-size:12px; color:var(--ink-soft);}
.matiere-tabs{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px;}
.matiere-tab{padding:13px 18px; background:#fff; border:1px solid var(--paper-line); border-bottom:4px solid var(--tab-accent,var(--bordeaux)); border-radius:10px 10px 4px 4px; box-shadow:var(--shadow); font-weight:600; font-size:14px; transition:transform .15s;}
.matiere-tab:hover{transform:translateY(-3px);}
a.matiere-tab{display:inline-block; color:inherit; text-decoration:none;}
.docs-dossier{background:#fff; border:1px solid var(--paper-line); border-radius:10px; margin-bottom:10px; overflow:hidden; box-shadow:0 2px 8px rgba(43,36,27,.05);}
.docs-dossier > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:14px 18px; font-weight:600; font-size:15px;}
.docs-dossier > summary::-webkit-details-marker{display:none;}
.docs-chevron{flex:none; width:22px; height:22px; border-radius:6px; background:var(--dossier-accent,var(--bordeaux)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; transition:transform .18s;}
.docs-dossier[open] .docs-chevron{transform:rotate(90deg);}
.docs-compte{margin-left:auto; flex:none; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--parchment-deep); padding:3px 9px; border-radius:999px;}
.docs-liste{padding:0 18px 14px 52px;}
.doc-item{display:flex; align-items:baseline; gap:12px; padding:11px 0; border-top:1px solid var(--paper-line); text-decoration:none; color:var(--ink);}
.doc-item .doc-titre{font-weight:600; font-size:14.5px;}
.doc-item .doc-desc{display:block; font-weight:400; font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
a.doc-item:hover .doc-titre{color:var(--dossier-accent,var(--bordeaux)); text-decoration:underline;}
.doc-ouvrir{margin-left:auto; flex:none; font-size:12px; font-weight:600; color:var(--dossier-accent,var(--bordeaux));}
.doc-item.doc-vide{color:var(--ink-soft); font-style:italic;}
.doc-item.doc-vide .doc-ouvrir{color:var(--ink-soft); font-style:normal;}
.docs-empty{background:rgba(255,255,255,.55); border:1px dashed var(--gold); border-radius:var(--radius); padding:22px 24px; font-size:14px; color:var(--ink-soft);}
.theme-block{margin-bottom:22px;}
.theme-title{font-weight:700; font-size:14.5px; color:var(--ink); background:#fff; border:1px solid var(--paper-line); border-radius:10px; padding:14px 18px; margin-bottom:8px;}
.chapitres-list{display:flex; flex-direction:column; gap:8px;}
.chapitre-row{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--paper-line); border-radius:10px; padding:13px 18px; box-shadow:0 2px 8px rgba(43,36,27,.05); transition:background .15s, transform .15s; width:100%;}
.chapitre-row:hover{background:var(--parchment-deep); transform:translateX(3px);}
.chapitre-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#fff; background:var(--rust); width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex:none; font-weight:600;}
.chapitre-row .titre{font-weight:600; font-size:14.5px;}
.resource-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:10px;}
.resource-btn{background:#fff; border:1px solid var(--paper-line); border-radius:10px; padding:22px 14px; text-align:center; font-weight:600; font-size:14px; box-shadow:0 2px 8px rgba(43,36,27,.05); transition:transform .15s, background .15s;}
.resource-btn:hover{transform:translateY(-3px); background:var(--parchment-deep);}
.resource-btn.has-content{color:var(--bordeaux); border-color:var(--bordeaux);}
.overlay{display:none; position:fixed; inset:0; background:rgba(43,36,27,.55); align-items:flex-start; justify-content:center; padding:40px 20px; overflow:auto; z-index:50;}
.overlay.active{display:flex;}
.modal{background:var(--parchment); max-width:720px; width:100%; border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.35); overflow:hidden;}
.modal-head{background:linear-gradient(120deg,var(--bordeaux),var(--bordeaux-deep)); color:#fff; padding:22px 28px; display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
.modal-head h2{font-family:'Cormorant Garamond',serif; font-size:24px; margin:0;}
.modal-close{color:#fff; font-size:22px; line-height:1; padding:4px 8px; opacity:.8;}
.modal-body{padding:22px 28px 30px; font-size:14.5px; line-height:1.6;}
.modal-body strong{color:var(--bordeaux-deep);}
.modal-body ul, .modal-body ol{padding-left:20px;}
.modal-body p{margin:0 0 12px;}
.modal-placeholder{font-size:13px; color:var(--ink-soft); font-style:italic; background:rgba(255,255,255,.5); border:1px dashed var(--paper-line); border-radius:8px; padding:14px 16px;}
footer.note{margin-top:50px; padding:20px 32px; border-top:1px solid var(--paper-line); font-size:12px; color:var(--ink-soft); text-align:center;}
.loader-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:16px; text-align:center; padding:20px;}
.loader-spin{width:36px; height:36px; border:3px solid var(--paper-line); border-top-color:var(--bordeaux); border-radius:50%; animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{max-width:520px; background:#fff; border:1px solid var(--paper-line); border-radius:12px; padding:22px 26px; text-align:left; box-shadow:var(--shadow);}
.error-box h3{margin:0 0 10px; color:var(--bordeaux); font-family:'Cormorant Garamond',serif;}
.error-box ol{padding-left:20px; font-size:13.5px; line-height:1.7;}
@media (max-width:820px){.niveaux-grid{grid-template-columns:1fr;} .transversal-grid{grid-template-columns:1fr;} .resource-grid{grid-template-columns:1fr 1fr;} .topbar,.breadcrumb,main{padding-left:16px; padding-right:16px;}}
</style>
</head>
<body>
<div class="topbar">
<div class="brand-seal">H</div>
<div class="brand-text">
<div class="t1 display">Histoire · Géographie · EMC</div>
<div class="t2 mono">Collège — 6e · 5e · 3e</div>
</div>
</div>
<div class="breadcrumb" id="breadcrumb"></div>
<main id="main-content">
<div class="loader-screen" id="loader">
<div class="loader-spin"></div>
<p style="color:var(--ink-soft);">Chargement du contenu depuis Google Sheets...</p>
</div>
</main>
<footer class="note">Contenu géré depuis un Google Sheet — modifiable à tout moment sans retoucher ce fichier.</footer>
<div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
<div class="modal">
<div class="modal-head"><h2 class="display" id="modal-title"></h2><button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="modal-body" id="modal-body"></div>
</div>
</div>
<script>
const SHEET_ID = "1U-2XhJB_DXRiCcNAP8qW9DQnYJr4rc2xGyVqkCVXWeA";
const SHEET_ID_2 = "1HC30jWprlLRGo2tpBBYEFLmv5oFVVXSUpdtOjnSKX_E";
const RESOURCE_BUTTONS = ["Cours / Leçon", "Fiche de révision", "Vocabulaire", "Ce que je dois savoir", "Documents", "Vidéos", "Activités", "Évaluation", "Correction des activités", "Correction progressive", "Pour aller plus loin"];
const CONTENT_MAP = {"Cours / Leçon": "Lecon", "Fiche de révision": "FicheDeRevision", "Vocabulaire": "Vocabulaire", "Ce que je dois savoir": "CeQueJeDoisSavoir", "Documents": "Documents", "Vidéos": "Videos", "Activités": "Activites", "Évaluation": "Evaluation", "Correction des activités": "Correction", "Correction progressive": "CorrectionProgressive", "Pour aller plus loin": "PourAllerPlusLoin"};
const LEVEL_META = {"6e": {"label": "6ème", "accent": "#8B2625", "desc": "La Préhistoire, l'Orient ancien, la Grèce et Rome, les débuts du judaïsme et du christianisme."}, "5e": {"label": "5ème", "accent": "#C1622B", "desc": "Le Moyen Âge, le monde islamique, la Méditerranée médiévale et la Renaissance."}, "3e": {"label": "3ème", "accent": "#2B5D5C", "desc": "Les guerres mondiales, la guerre froide, la construction européenne et le monde actuel."}};
const MATIERE_ORDER = ["Histoire", "Géographie", "EMC", "Méthodo", "Sites utiles", "Brevet"];
const DOCUMENTS = {
  "6e": [],
  "5e": [],
  "3e": [
    {dossier:"Brevet", titre:"Les modalit\u00e9s du brevet 2027", description:"\u00c9preuves, dur\u00e9es, bar\u00e8mes, calcul de la note et mentions.", lien:"documents/brevet-3e-2027.html"}
  ]
};
const MANUEL_NUMERIQUE = {
  "6e": "https://www.lelivrescolaire.fr/manuels/histoire-geographie-emc-6eme-2016",
  "5e": "https://www.editions-hatier.fr/flip/flex/97824010201539",
  "3e": "https://www.lelivrescolaire.fr/manuels/histoire-geographie-emc-3eme-2021"
};
let ROWS = [];
let currentChapterRow = null;
let state = {niveau:null, matiere:null};
async function fetchSheetRows(sheetId, onglet){
  let url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
  if(onglet) url += `&sheet=${encodeURIComponent(onglet)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('fetch_failed');
  const text = await res.text();
  const start = text.indexOf('(');
  const end = text.lastIndexOf(')');
  if(start === -1 || end === -1) throw new Error('reponse_illisible');
  const json = JSON.parse(text.substring(start+1, end));
  if(!json.table || !json.table.cols) throw new Error('onglet_absent');
  const cols = json.table.cols.map(c => c.label);
  return json.table.rows.map(r => {
    const obj = {};
    cols.forEach((c,i) => { obj[c] = (r.c[i] && r.c[i].v !== null) ? r.c[i].v : ''; });
    return obj;
  });
}
function mergeRows(baseRows, updateRows){
  const key = r => `${r.Niveau}|${r.Matiere}|${r.Chapitre}`;
  const byKey = {};
  baseRows.forEach(r => { byKey[key(r)] = {...r}; });
  updateRows.forEach(r => {
    const k = key(r);
    if(byKey[k]){
      Object.keys(r).forEach(field => {
        if(r[field] !== '' && r[field] !== undefined) byKey[k][field] = r[field];
      });
    } else {
      byKey[k] = {...r};
    }
  });
  return Object.values(byKey);
}
async function loadData(){
  const baseRows = await fetchSheetRows(SHEET_ID);
  let updateRows = [];
  try {
    updateRows = await fetchSheetRows(SHEET_ID_2);
  } catch(e) {
    console.warn('Tableau de mise à jour (contenu 6e/5e/3e) inaccessible.', e);
    window.__sheet2Failed = true;
  }
  ROWS = mergeRows(baseRows, updateRows);
}
function showError(){
  document.getElementById('main-content').innerHTML = `
    <div class="loader-screen">
      <div class="error-box">
        <h3 class="display">Impossible de charger le contenu</h3>
        <p style="font-size:13.5px;">Le Google Sheet n'est probablement pas encore partagé publiquement. Pour corriger :</p>
        <ol>
          <li>Ouvre le Google Sheet "HG_EMC_Contenu_Site" dans ton Drive.</li>
          <li>Clique sur "Partager" en haut à droite.</li>
          <li>Sous "Accès général", choisis "Tous les utilisateurs disposant du lien" avec le rôle "Lecteur".</li>
          <li>Recharge cette page.</li>
        </ol>
      </div>
    </div>`;
}
function jsAttr(v){ return JSON.stringify(v).replace(/'/g, "\\u0027"); }
function setBreadcrumb(items){
  document.getElementById('breadcrumb').innerHTML = items.map((it,i)=>{
    const last = i===items.length-1;
    return (i>0?'<span class="crumb-sep">›</span>':'') + `<button class="crumb ${last?'current':''}" onclick='${it.action||''}'>${it.label}</button>`;
  }).join('');
}
function showView(html){ document.getElementById('main-content').innerHTML = html; window.scrollTo({top:0,behavior:'smooth'}); }
function getLevels(){ return [...new Set(ROWS.map(r=>r.Niveau))].filter(Boolean); }
function getMatieres(niveau){
  const set = [...new Set(ROWS.filter(r=>r.Niveau===niveau).map(r=>r.Matiere))];
  if(!set.includes('EMC')) set.push('EMC');
  if(!set.includes('Méthodo')) set.push('Méthodo');
  return set.sort((a,b)=> (MATIERE_ORDER.indexOf(a)+1||99) - (MATIERE_ORDER.indexOf(b)+1||99));
}
function getThemes(niveau, matiere){
  const rows = ROWS.filter(r=>r.Niveau===niveau && r.Matiere===matiere);
  const themes = [];
  const seen = new Set();
  rows.forEach(r=>{ if(!seen.has(r.Theme)){ seen.add(r.Theme); themes.push(r.Theme); } });
  return themes.map(t=>({
    title: t,
    chapters: rows.filter(r=>r.Theme===t).sort((a,b)=>(a.Ordre||0)-(b.Ordre||0))
  }));
}
function goHome(){
  const levels = getLevels();
  const cards = levels.map(key=>{
    const meta = LEVEL_META[key] || {label:key, accent:'#8B2625', desc:''};
    return `<button class="niveau-card" style="--card-accent:${meta.accent}" onclick="goNiveau('${key}')">
      <span class="niveau-tag mono">NIVEAU</span>
      <h2 class="display">${meta.label}</h2>
      <p>${meta.desc}</p>
      <span class="go">Entrer →</span>
    </button>`;
  }).join('');
  const warning = window.__sheet2Failed ? `<div class="error-box" style="margin-bottom:24px;"><h3 class="display" style="font-size:16px;">⚠️ Mises à jour récentes non chargées</h3><p style="font-size:13px;">Le tableau de mise à jour n'a pas pu être lu (probablement pas encore partagé publiquement). Le contenu affiché peut être incomplet.</p></div>` : '';
  showView(`
    ${warning}
    <div class="eyebrow">Bienvenue</div>
    <h1 class="page-title display">Choisis ton niveau</h1>
    <p class="page-sub">Toutes les leçons, vidéos et activités corrigées, classées simplement.</p>
    <div class="niveaux-grid">${cards}</div>
    <div class="eyebrow">Communs à tous les niveaux</div>
    <div class="transversal-grid">
      <button class="transversal-card" onclick="goEMC()"><div><h3 class="display">EMC</h3><p>Éducation morale et civique — un onglet par niveau.</p></div></button>
      <button class="transversal-card" onclick="goMethodo()"><div><h3 class="display">Méthodologie</h3><p>Fiches-outils communes à tous les niveaux.</p></div></button>
    </div>`);
  setBreadcrumb([{label:'Accueil', action:'goHome()'}]);
}
function goNiveau(key){
  state.niveau = key;
  const meta = LEVEL_META[key] || {label:key, accent:'#8B2625'};
  const matieres = getMatieres(key);
  const tabs = matieres.map(m=>`<button class="matiere-tab" style="--tab-accent:${meta.accent}" onclick='goMatiere(${jsAttr(key)},${jsAttr(m)})'>${m}</button>`).join('');
  const manuelUrl = MANUEL_NUMERIQUE[key];
  const manuelTab = manuelUrl
    ? `<a class="matiere-tab" style="--tab-accent:${meta.accent}" href="${manuelUrl}" target="_blank" rel="noopener noreferrer">Mon manuel num\u00e9rique</a>`
    : '';
  const docsTab = `<button class="matiere-tab" style="--tab-accent:${meta.accent}" onclick='goDocuments(${jsAttr(key)})'>Documents</button>`;
  showView(`
    <div class="eyebrow">Niveau</div>
    <h1 class="page-title display">${meta.label}</h1>
    <p class="page-sub">Choisis une mati\u00e8re pour acc\u00e9der \u00e0 la liste des chapitres.</p>
    <div class="matiere-tabs">${tabs}${manuelTab}${docsTab}</div>`);
  setBreadcrumb([{label:'Accueil',action:'goHome()'},{label:meta.label,action:`goNiveau('${key}')`}]);
}
function getDocs(niveauKey){
  return DOCUMENTS[niveauKey] || [];
}
function goDocuments(niveauKey){
  const meta = LEVEL_META[niveauKey] || {label:niveauKey, accent:'#8B2625'};
  const docs = getDocs(niveauKey);
  const dossiers = [];
  const parDossier = {};
  docs.forEach(d => {
    const nom = (d.dossier || 'Documents').trim();
    if(!parDossier[nom]){ parDossier[nom] = []; dossiers.push(nom); }
    parDossier[nom].push(d);
  });
  let corps;
  if(docs.length === 0){
    corps = `<div class="docs-empty">Aucun document n\u0027est encore publi\u00e9 pour ce niveau. Reviens bient\u00f4t.</div>`;
  } else {
    corps = dossiers.map((nom, i) => {
      const items = parDossier[nom].map(d => {
        const bloc = `<span><span class="doc-titre">${d.titre}</span>${d.description ? `<span class="doc-desc">${d.description}</span>` : ''}</span>`;
        return d.lien
          ? `<a class="doc-item" href="${d.lien}" target="_blank" rel="noopener noreferrer">${bloc}<span class="doc-ouvrir">Ouvrir</span></a>`
          : `<div class="doc-item doc-vide">${bloc}<span class="doc-ouvrir">Bient\u00f4t</span></div>`;
      }).join('');
      return `<details class="docs-dossier" style="--dossier-accent:${meta.accent}" ${i === 0 ? 'open' : ''}>
        <summary><span class="docs-chevron">\u25b6</span>${nom}<span class="docs-compte mono">${parDossier[nom].length}</span></summary>
        <div class="docs-liste">${items}</div>
      </details>`;
    }).join('');
  }
  showView(`
    <div class="eyebrow">${meta.label}</div>
    <h1 class="page-title display">Documents</h1>
    <p class="page-sub">Clique sur un dossier pour voir ce qu\u0027il contient. Chaque document s\u0027ouvre dans un nouvel onglet.</p>
    ${corps}`);
  setBreadcrumb([{label:'Accueil',action:'goHome()'},{label:meta.label,action:`goNiveau(${jsAttr(niveauKey)})`},{label:'Documents',action:''}]);
}
function goMatiere(niveauKey, matiere){
  if(matiere==='EMC'){ goEMC(); return; }
  if(matiere==='Méthodo'){ goMethodo(); return; }
  state.matiere = matiere;
  const meta = LEVEL_META[niveauKey] || {label:niveauKey};
  const themes = getThemes(niveauKey, matiere);
  const blocks = themes.map(theme => `
    <div class="theme-block">
      <div class="theme-title">${theme.title}</div>
      <div class="chapitres-list">
        ${theme.chapters.map((row,i)=>`<button class="chapitre-row" onclick='goChapitre(${jsAttr(niveauKey)},${jsAttr(matiere)},${jsAttr(row.Chapitre)})'><span class="chapitre-num mono">${i+1}</span><span class="titre">${row.Chapitre}</span></button>`).join('')}
      </div>
    </div>`).join('');
  showView(`
    <div class="eyebrow">${meta.label} · ${matiere}</div>
    <h1 class="page-title display">${matiere}</h1>
    ${blocks}`);
  setBreadcrumb([{label:'Accueil',action:'goHome()'},{label:meta.label,action:`goNiveau(${jsAttr(niveauKey)})`},{label:matiere,action:`goMatiere(${jsAttr(niveauKey)},${jsAttr(matiere)})`}]);
}
function isLocked(btnLabel){
  return currentChapterRow && currentChapterRow.Verrouille && currentChapterRow.Verrouille.split(',').map(s=>s.trim().toLowerCase()).includes(btnLabel.toLowerCase());
}
function goChapitre(niveauKey, matiere, chapTitre){
  const meta = LEVEL_META[niveauKey] || {label:niveauKey};
  const row = ROWS.find(r=>r.Niveau===niveauKey && r.Matiere===matiere && r.Chapitre===chapTitre);
  currentChapterRow = row;
  const lockedList = (row && row.Verrouille) ? row.Verrouille.split(',').map(s=>s.trim().toLowerCase()) : [];
  const buttons = RESOURCE_BUTTONS.map(btn=>{
    const key = CONTENT_MAP[btn];
    const hasContent = row && key && row[key];
    const locked = lockedList.includes(btn.toLowerCase());
    return `<button class="resource-btn ${hasContent?'has-content':''}" onclick='openResource(${jsAttr(btn)})'>${locked?'🔒 ':''}${btn}</button>`;
  }).join('');
  showView(`
    <div class="eyebrow">${matiere}</div>
    <h1 class="page-title display">${chapTitre}</h1>
    <div class="resource-grid">${buttons}</div>`);
  setBreadcrumb([{label:'Accueil',action:'goHome()'},{label:meta.label,action:`goNiveau(${jsAttr(niveauKey)})`},{label:matiere,action:`goMatiere(${jsAttr(niveauKey)},${jsAttr(matiere)})`},{label:chapTitre,action:''}]);
}
function openResource(btnLabel){
  document.getElementById('modal-title').textContent = btnLabel;
  const key = CONTENT_MAP[btnLabel];
  const body = document.getElementById('modal-body');
  if(isLocked(btnLabel)){
    body.innerHTML = '<div class="modal-placeholder">🔒 Ce contenu n\'est pas encore disponible. Demande à ton professeur si tu penses qu\'il devrait l\'être.</div>';
  } else if(currentChapterRow && key && currentChapterRow[key]){
    body.innerHTML = currentChapterRow[key];
  } else {
    body.innerHTML = '<div class="modal-placeholder">Contenu à ajouter — remplis la colonne correspondante dans le Google Sheet.</div>';
  }
  document.getElementById('overlay').classList.add('active');
}
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }
function goEMC(){
  setBreadcrumb([{label:'Accueil',action:'goHome()'},{label:'EMC',action:'goEMC()'}]);
  showView(`
    <div class="eyebrow">Page transversale</div>
    <h1 class="page-title display">EMC — Éducation Morale et Civique</h1>
    <div class="chapitres-list">
      <div class="chapitre-row"><span class="chapitre-num mono">T1</span><span class="titre">Respecter autrui (6e-5e)</span></div>
      <div class="chapitre-row"><span class="chapitre-num mono">T2</span><span class="titre">Citoyenneté et institutions (3e)</span></div>
      <div class="chapitre-row"><span class="chapitre-num mono">T3</span><span class="titre">La défense et la paix (3e)</span></div>
      <div class="chapitre-row"><span class="chapitre-num mono">T4</span><span class="titre">Les grands principes des sociétés démocratiques (3e)</span></div>
    </div>`);
}
function goMethodo(){
  setBreadcrumb([{label:'Accueil',action:'goHome()'},{label:'Méthodologie',action:'goMethodo()'}]);
  showView(`
    <div class="eyebrow">Page transversale</div>
    <h1 class="page-title display">Méthodologie</h1>
    <div class="chapitres-list">
      <div class="chapitre-row"><span class="chapitre-num mono">M1</span><span class="titre">Analyser un document</span></div>
      <div class="chapitre-row"><span class="chapitre-num mono">M2</span><span class="titre">Rédiger un paragraphe argumenté</span></div>
      <div class="chapitre-row"><span class="chapitre-num mono">M3</span><span class="titre">Construire une frise chronologique</span></div>
      <div class="chapitre-row"><span class="chapitre-num mono">M4</span><span class="titre">Réaliser une carte mentale de révision</span></div>
    </div>`);
}
loadData().then(goHome).catch(showError);
</script>
